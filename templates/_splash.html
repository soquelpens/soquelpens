<!-- Splash page to show an image on first load when needed -->
<style>
  /* ---------- Splash overlay ---------- */
  .splash-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    background: rgba(27, 26, 23, 0.55);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 1000;
  }
  .splash-overlay[hidden] { display: none; }
  .splash-overlay.is-open { opacity: 1; pointer-events: auto; }

  .splash-card {
    position: relative;
    display: grid;
    grid-template-columns: 1fr;
    width: 100%;
    max-width: 540px;
    background: var(--parchment);
    border: 1px solid rgba(27, 26, 23, 0.15);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.45);
    transform: translateY(12px) scale(0.98);
    transition: transform 0.35s ease;
  }
  .splash-overlay.is-open .splash-card { transform: translateY(0) scale(1); }

  .splash-close {
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    border: none;
    background: rgba(27, 26, 23, 0.08);
    color: var(--ink);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .splash-close:hover { background: rgba(27, 26, 23, 0.18); }

  .splash-art {
    background: var(--forest);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  .splash-art svg { width: 100%; max-width: 270px; height: auto; }

  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  @media (max-width: 560px) {
    .splash-card { grid-template-columns: 1fr; }
    .splash-art { padding: 1.5rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .splash-overlay, .splash-card, .splash-cta {
      transition: none !important;
      transform: none !important;
    }
  }
</style>

<!-- Splash page -->
<div id="splash-overlay" class="splash-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="splash-heading">
  <div class="splash-card">
    <button class="splash-close" type="button" aria-label="Close welcome message">&times;</button>
    <div class="splash-art">
      <img src="uploads/ice-cream.jpg" />
    </div>
  </div>
</div>


<script>
(function () {
  const STORAGE_KEY = 'spens:splash:seen:2';
  const overlay = document.getElementById('splash-overlay');
  const card = overlay.querySelector('.splash-card');
  const closeBtn = overlay.querySelector('.splash-close');

  function trapFocus(e) {
    if (e.key === 'Escape') { closeSplash(); return; }
    if (e.key !== 'Tab') return;
    const focusables = [closeBtn, ctaBtn];
    const idx = focusables.indexOf(document.activeElement);
    e.preventDefault();
    const next = e.shiftKey
      ? focusables[idx <= 0 ? focusables.length - 1 : idx - 1]
      : focusables[idx === focusables.length - 1 ? 0 : idx + 1];
    next.focus();
  }

  function openSplash() {
    overlay.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      overlay.classList.add('is-open');
      closeBtn.focus();
    }));
    document.addEventListener('keydown', trapFocus);
  }

  function closeSplash() {
    overlay.classList.remove('is-open');
    document.removeEventListener('keydown', trapFocus);
    overlay.addEventListener('transitionend', function onEnd(e) {
      if (e.target === overlay) {
        overlay.hidden = true;
        overlay.removeEventListener('transitionend', onEnd);
      }
    });
  }

  closeBtn.addEventListener('click', closeSplash);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSplash(); });
  card.addEventListener('click', (e) => e.stopPropagation());

  async function hasSeenSplash() {
    try {
      const result = await window.localStorage.getItem(STORAGE_KEY, false);
      return result
    } catch (err) {
      // Key doesn't exist yet — this is a first-time visit.
      return false;
    }
  }

  async function markSplashSeen() {
    try {
      await window.localStorage.setItem(STORAGE_KEY, 'true');
    } catch (err) {
      console.error('Could not persist splash state', err);
    }
  }

  async function init() {
    const seen = await hasSeenSplash();
    if (!seen) {
      openSplash();
      await markSplashSeen();
    }
    // openSplash(); // Testing.
  }

  init();
})();
</script>
